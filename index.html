<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testseite</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #e8f0f7;
      font-family: system-ui, sans-serif;
      color: #1a3a5c;
    }
    h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 1rem; text-align: center; }
    svg { width: 260px; height: auto; }
    .arm {
      transform-origin: 118px 110px;
      animation: wave 0.8s ease-in-out infinite alternate;
    }
    @keyframes wave {
      from { transform: rotate(-15deg); }
      to   { transform: rotate(25deg); }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 200 260" role="img" aria-label="Winkendes Männchen">
    <!-- Beine -->
    <line x1="100" y1="170" x2="80" y2="240" stroke="#1a3a5c" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="170" x2="120" y2="240" stroke="#1a3a5c" stroke-width="8" stroke-linecap="round"/>
    <!-- Körper -->
    <line x1="100" y1="90" x2="100" y2="170" stroke="#1a3a5c" stroke-width="8" stroke-linecap="round"/>
    <!-- linker Arm -->
    <line x1="100" y1="110" x2="68" y2="150" stroke="#1a3a5c" stroke-width="8" stroke-linecap="round"/>
    <!-- winkender Arm -->
    <g class="arm">
      <line x1="100" y1="110" x2="140" y2="55" stroke="#1a3a5c" stroke-width="8" stroke-linecap="round"/>
      <circle cx="142" cy="50" r="9" fill="#f5c9a0" stroke="#1a3a5c" stroke-width="3"/>
    </g>
    <!-- Kopf -->
    <circle cx="100" cy="60" r="28" fill="#f5c9a0" stroke="#1a3a5c" stroke-width="5"/>
    <circle cx="90" cy="55" r="3.5" fill="#1a3a5c"/>
    <circle cx="110" cy="55" r="3.5" fill="#1a3a5c"/>
    <path d="M86 70 Q100 82 114 70" fill="none" stroke="#1a3a5c" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <h1>Testseite</h1>
</body>
</html>
